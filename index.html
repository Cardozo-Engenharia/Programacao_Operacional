<!DOCTYPE html>
<html lang="pt-BR" style="--topo: 46px;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programação Operacional — Cardozo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101C2B; --ink2:#2A3A4D; --mut:#68737F;
  --bg:#EDF0F3; --card:#FFFFFF; --line:#DCE2E9; --line2:#EDF0F4;
  --cdz:#1551A7; --cdz-dk:#0C3A78; --cdz-soft:#E7EFFA;
  --t1:#9A5B00; --t1-bg:#FFF0D4; --t1-br:#F0C878;
  --t2:#2E3E8F; --t2-bg:#E6E9FB; --t2-br:#B3BCEC;
  --fg:#7A838D; --fg-bg:#EAEDF0;
  --lamp:#F2B705;
  --ok:#1E7A4B;
  --disp:'Barlow Condensed','Oswald','Arial Narrow',Inter,system-ui,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --topo:43px;
  --r:14px;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body);
  font-size:15px; line-height:1.45;
  padding-bottom:48px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto}
.mono{font-family:var(--mono)}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:.01em;margin:0}

/* ── Cabeçalho ── */
header{
  background:linear-gradient(160deg,#12283F 0%,#0C3A78 60%,#1551A7 100%);
  color:#fff; padding:14px var(--pad) 13px; position:relative; overflow:hidden;
}
header .logo{display:block;height:31px;width:auto;background:#fff;border-radius:8px;
  padding:6px 10px;margin-bottom:11px;box-sizing:content-box;max-width:calc(100% - 20px);object-fit:contain}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--lamp) 0%,var(--lamp) 22%,rgba(242,183,5,.15) 22%)}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#9DC0EC;font-weight:600}
header h1{font-size:32px;font-weight:700;text-transform:uppercase;
  line-height:1.05;margin:0;white-space:nowrap;overflow:hidden}
.hdr-meta{font-size:12.5px;color:#BDD5F0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hdr-meta b{color:#fff;font-weight:600}

/* ── Faixa "hoje" ── */
.hoje{background:var(--card);padding:12px var(--pad) 4px;border-bottom:1px solid var(--line)}
.hoje-cab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:8px}
.hoje-cab .d{font-family:var(--disp);font-size:21px;font-weight:700;text-transform:uppercase}
.hoje-cab .s{font-size:11.5px;color:var(--mut)}
.btn-hoje{background:var(--cdz-soft);color:var(--cdz-dk);border:none;border-radius:99px;
  font-size:11.5px;font-weight:600;padding:5px 11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.letras{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.lt{border-radius:12px;padding:9px 4px 8px;text-align:center;border:1.5px solid transparent;
  cursor:pointer;font-family:inherit;width:100%;display:block;position:relative;transition:box-shadow .12s}
.lt.on{box-shadow:0 0 0 2.5px var(--cdz)}
.lt.on:after{content:"✓";position:absolute;top:3px;right:6px;font-size:11px;font-weight:700;color:var(--cdz)}
.lt .n{font-family:var(--disp);font-size:27px;font-weight:700;line-height:1}
.lt .t{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.lt .h{font-size:9.5px;margin-top:1px;opacity:.85}
.lt.T1{background:var(--t1-bg);border-color:var(--t1-br);color:var(--t1)}
.lt.T2{background:var(--t2-bg);border-color:var(--t2-br);color:var(--t2)}
.lt.F{background:var(--fg-bg);color:var(--fg)}

/* ── Régua de dias ── */
.regua-box{background:var(--card);padding:0 0 10px;border-bottom:1px solid var(--line)}
.regua{display:flex;gap:6px;overflow-x:auto;padding:2px var(--pad) 6px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.regua::-webkit-scrollbar{display:none}
.dia{flex:0 0 auto;width:52px;scroll-snap-align:center;border:1px solid var(--line);
  border-radius:11px;background:#fff;padding:5px 3px 4px;cursor:pointer;text-align:center}
.dia.sel{border-color:var(--cdz);box-shadow:0 0 0 2px rgba(21,81,167,.16)}
.dia.hoje-d .dd{color:var(--cdz);}
.dia .ds{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.dia .dd{font-family:var(--disp);font-size:19px;font-weight:700;line-height:1.05}
.dia .cells{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5px;margin-top:3px}
.dia .c{height:12px;border-radius:2.5px;font-size:7.5px;font-weight:700;line-height:12px;color:#fff}
.c.T1{background:#E2A63C}.c.T2{background:#5566C4}.c.F{background:#DFE3E8;color:#9AA3AC}
.regua-leg{display:flex;gap:12px;padding:0 var(--pad);font-size:10.5px;color:var(--mut);flex-wrap:wrap}
.regua-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ── Abas ── */
nav.abas{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;overflow-x:auto;scrollbar-width:none}
nav.abas::-webkit-scrollbar{display:none}
nav.abas button{flex:1 1 0;min-width:0;background:none;border:none;padding:12px 4px 10px;white-space:nowrap;
  font-family:var(--disp);font-size:clamp(12px,3.4vw,17px);font-weight:600;text-transform:uppercase;
  letter-spacing:.02em;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;overflow:hidden;text-overflow:ellipsis}
nav.abas button.on{color:var(--ink);border-bottom-color:var(--lamp)}

/* ── Filtros ── */
.filtros{background:var(--card);border-bottom:1px solid var(--line);padding:10px var(--pad)}
.busca{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;
  font-family:inherit;background:#F7F9FB;color:var(--ink)}
.busca:focus{outline:2px solid rgba(21,81,167,.35);outline-offset:1px}
.selects{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none;padding-bottom:1px}
.selects::-webkit-scrollbar{display:none}
.selects select{flex:0 0 auto;border:1px solid var(--line);border-radius:99px;background:#F7F9FB;
  padding:7px 26px 7px 11px;font-size:12.5px;font-family:inherit;color:var(--ink2);font-weight:500;
  appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2368737F'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;max-width:46vw}
.selects select.ativo{background-color:var(--cdz-soft);border-color:#A9C7EC;color:var(--cdz-dk);font-weight:600}
.limpar{background:none;border:none;color:var(--cdz);font-size:12px;font-weight:600;cursor:pointer;
  padding:7px 4px;font-family:inherit;flex:0 0 auto}

/* ── Conteúdo ── */
main{padding:12px var(--pad) 20px}
.resumo{display:flex;gap:8px;margin-bottom:12px}
.kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.kpi .v{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1}
.kpi .l{font-size:10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600;margin-top:1px}
.kpi.t1 .v{color:var(--t1)} .kpi.t2 .v{color:var(--t2)} .kpi.adm .v{color:var(--ink2)}

.bloco{margin-bottom:22px}
.bloco-tit{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:0 2px}
.bloco-tit .p{font-family:var(--disp);font-size:19px;font-weight:700;text-transform:uppercase}
.bloco-tit .hh{font-size:11.5px;color:var(--mut);margin-left:auto;font-weight:500}
/* faixa de turno — fica presa no topo enquanto rola a seção */
.faixa{position:sticky;top:var(--topo);z-index:20;display:flex;align-items:center;gap:9px;
  padding:10px 12px;border-radius:11px;margin:0 0 11px;border:1.5px solid transparent}
.faixa .p{font-family:var(--disp);font-size:21px;font-weight:700;text-transform:uppercase;line-height:1}
.faixa .hh{font-family:var(--mono);font-size:11px;opacity:.85}
.faixa .cnt{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.8);
  border-radius:99px;padding:3px 10px;line-height:1.35}
.faixa.T1{background:var(--t1-bg);border-color:var(--t1-br);color:var(--t1)}
.faixa.T2{background:var(--t2-bg);border-color:var(--t2-br);color:var(--t2)}
.faixa.ADM{background:#E2EDE7;border-color:#B3D2C2;color:var(--ok)}

.sub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
  margin:14px 2px 7px;display:flex;align-items:center;gap:7px}
.sub:before{content:"";width:14px;height:2px;background:var(--lamp);border-radius:2px;flex:0 0 auto}

.obra{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden}
.obra-cab{display:flex;align-items:center;gap:8px;padding:9px 12px 8px;border-bottom:1px solid var(--line2)}
.obra-cab .nm{font-family:var(--disp);font-size:17.5px;font-weight:700;text-transform:uppercase;
  line-height:1.1;flex:1;min-width:0}
.obra-cab .sup{font-size:11px;color:var(--mut);font-weight:400;text-transform:none;font-family:var(--body);
  display:block;margin-top:1px}
.tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:44%}
.tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.03em;
  border:1px solid var(--line);border-radius:5px;padding:2.5px 6px;background:#F7F9FB;color:var(--ink2);white-space:nowrap}
.tag.placa{background:#F2F5F8;border-color:#C9D3DD;color:var(--ink);
  box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.05)}
.tag.jcb{background:#FFF4DE;border-color:#EBC77E;color:#8A5A00}

ul.pes{list-style:none;margin:0;padding:2px 0}
ul.pes li{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line2);min-height:40px}
ul.pes li:first-child{border-top:none}
.let{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  font-family:var(--disp);font-size:15px;font-weight:700;background:#EFF2F6;color:var(--ink2)}
.let.A{background:#E7EFFA;color:#12437F}.let.B{background:#E9F1E9;color:#25663A}
.let.C{background:#FBEEE4;color:#8A4A16}.let.D{background:#EFEAF7;color:#4B3183}
.let.par{font-size:11px;letter-spacing:-.02em}
.let.adm{font-size:9.5px;letter-spacing:.02em}
.nome{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.nome small{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:-1px}
.badges{display:flex;gap:4px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.b{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2.5px 6px;border-radius:5px;white-space:nowrap}
.b.vl{background:#E7EFFA;color:#12437F}
.b.enc{background:#FFF1D4;color:#8A5A00}
.b.otj{background:#E4EEE9;color:var(--ok)}
.b.op{background:#F1EAF9;color:#513A86}
.b.tst{background:#FCE9E9;color:#933}
li.fora{opacity:.5}
.b.data{background:#EFF2F6;color:var(--mut);text-transform:none;letter-spacing:0;font-weight:600}
.b.fer{background:#FBEEE4;color:#8A4A16}

.vazio{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);
  padding:26px 18px;text-align:center;color:var(--mut);font-size:13.5px}
.vazio b{display:block;font-family:var(--disp);font-size:18px;color:var(--ink2);
  text-transform:uppercase;margin-bottom:3px}

/* Minha escala */
.busca-pessoa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pessoa-cab{background:linear-gradient(150deg,#12283F,#1551A7);color:#fff;border-radius:var(--r);
  padding:14px 15px;margin-bottom:10px}
.pessoa-cab .n{font-family:var(--disp);font-size:23px;font-weight:700;text-transform:uppercase;line-height:1.05}
.pessoa-cab .i{font-size:12.5px;color:#C3D9F2;margin-top:3px}
.prox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prox .l{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line2)}
.prox .l:first-child{border-top:none}
.prox .l.hj{background:#FFFBF0}
.prox .dt{font-family:var(--mono);font-size:12.5px;font-weight:600;width:74px;flex:0 0 auto}
.prox .dt span{color:var(--mut);font-weight:500}
.prox .st{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;flex:0 0 auto}
.prox .hr{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-left:auto}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug button{background:#F2F5F8;border:1px solid var(--line);border-radius:99px;padding:6px 11px;
  font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink2)}

/* Frota */
table.frota{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);
  overflow:hidden;border:1px solid var(--line);font-size:13px}
table.frota th{background:#F5F7FA;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);text-align:left;padding:8px 10px;font-weight:700}
table.frota td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:top}
table.frota td:nth-child(2),table.frota td:nth-child(3){white-space:nowrap;width:1%}
table.frota td:first-child{font-weight:500}

/* Rodapé / editor */
footer{padding:16px var(--pad) 26px;text-align:center;color:var(--mut);font-size:11.5px;line-height:1.6}
.editor{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:9px 10px;
  display:none;gap:7px;z-index:60;justify-content:center;flex-wrap:wrap}
.editor.on{display:flex}
.editor button,.editor label{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);
  border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.editor button.pri{background:var(--lamp);color:#3A2A00;border-color:var(--lamp)}
.editor input[type=file]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:var(--ink);color:#fff;
  padding:11px 17px;border-radius:11px;font-size:13.5px;z-index:70;opacity:0;transition:.25s;
  pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}

@media (min-width:620px){
  :root{--pad:20px}
  header .logo{height:36px}
  .lt .n{font-size:32px}
  .obra-cab .nm{font-size:19px}
  .dia{width:58px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function pd(s){ // aceita dd/mm/aaaa, aaaa-mm-dd ou número de série do Excel
  if(s===null||s===undefined||s==='') return null;
  if(typeof s==='number') return new Date(Math.round((s-25569)*86400000));
  s=String(s).trim(); if(!s) return null;
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){
    let d=+m[1], mes=+m[2], a=+m[3]; if(a<100) a+=2000;
    if(mes>12 && d<=12){ const t=d; d=mes; mes=t; }   // veio como mm/dd
    return new Date(a, mes-1, d);
  }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}

function d0(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDias(d,n){ const x=d0(d); x.setDate(x.getDate()+n); return x; }
function difDias(a,b){ return Math.round((d0(a)-d0(b))/86400000); }

const REF = {};   // letra -> Date do 1º dia do ciclo
function carregarRef(){
  Object.keys(REF).forEach(k=>delete REF[k]);
  (D.escala||[]).forEach(r=>{ const dt=pd(r[1]); if(dt) REF[String(r[0]).trim().toUpperCase()]=dt; });
}
const REG = {};   // nome do regime -> objeto
function carregarReg(){
  Object.keys(REG).forEach(k=>delete REG[k]);
  (D.regimes||[]).forEach(r=>{
    REG[r[0]] = {tipo:r[1], t1:[r[2],r[3]], t2:[r[4],r[5]], dias:r[6]};
  });
}
function cfg(chave, padrao){
  const l = (D.config||[]).find(c=>String(c[0]).toLowerCase().includes(chave));
  return l ? l[1] : padrao;
}

/* Posição no ciclo de 8 dias para uma letra numa data */
function passoCiclo(letra, data){
  const r = REF[letra]; if(!r) return null;
  return ((difDias(data, r) % 8) + 8) % 8;
}
/* Turno bruto da letra (T1 / T2 / F) */
function turnoLetra(letra, data){
  const p = passoCiclo(letra, data);
  return p===null ? null : CICLO[p];
}
/* Turno efetivo de uma pessoa numa data: 'T1' | 'T2' | 'ADM' | 'F' | null */
function turnoPessoa(p, data){
  const reg = REG[p.regime] || {tipo:'ADM'};
  const dw = data.getDay();
  const L = (p.letra||'').trim().toUpperCase();

  if(reg.tipo==='4x4-T1T2' || reg.tipo==='4x4-T1'){
    if(L.includes('/')){                       // letras pareadas: só 1º turno
      const partes = L.split('/').map(s=>s.trim());
      const trabalha = partes.some(x => turnoLetra(x, data)==='T1');
      return trabalha ? 'T1' : 'F';
    }
    const t = turnoLetra(L, data);
    if(t===null) return null;
    if(t==='F') return 'F';
    return reg.tipo==='4x4-T1' ? 'T1' : t;
  }
  if(reg.tipo==='ADM')      return (dw>=1 && dw<=5) ? 'ADM' : 'F';
  if(reg.tipo==='5x2-6x1'){
    if(dw===0) return 'F';
    if(dw>=1 && dw<=5) return 'ADM';
    const ref = pd(cfg('sábado','22/08/2026'));  // sábado trabalhado de referência
    if(!ref) return 'F';
    return (Math.abs(difDias(data,ref)) % 14 === 0) ? 'ADM' : 'F';
  }
  if(reg.tipo==='Pontual-T1') return 'T1';       // obra spot em turno, vigência por Início/Fim
  if(reg.tipo==='Pontual')  return 'ADM';        // obra spot administrativa
  return null;
}
/* Situação preenchida (Férias, Afastado…) = fora da programação */
function ausente(p){ return !!(p.situacao||'').trim(); }
/* A data está dentro da janela Início / Fim da linha? */
function dentroJanela(p, data){
  const i = pd(p.inicio), f = pd(p.fim);
  if(i && d0(data) < i) return false;
  if(f && d0(data) > f) return false;
  return true;
}
/* A pessoa está efetivamente programada nesta data? */
function vigente(p, data){ return !ausente(p) && dentroJanela(p, data); }
function horario(p, turno){
  const reg = REG[p.regime]; if(!reg) return '';
  if(turno==='T2' && reg.t2[0]) return reg.t2[0]+'–'+reg.t2[1];
  if(reg.t1[0]) return reg.t1[0]+'–'+reg.t1[1];
  return '';
}

/* ═══════════════ Estado ═══════════════ */
const ABAS = [
  {id:'dia',    r:'Do dia'},
  {id:'equipes',r:'Equipes'},
  {id:'pessoa', r:'Escala'},
  {id:'frota',  r:'Frota'}
];
const DIAS_ANTES = 4, DIAS_DEPOIS = 17;   // horizonte do calendário
const S = { aba:'dia', data:d0(new Date()), q:'', f:{unidade:'',supervisor:'',disciplina:'',letra:'',obra:''}, pessoa:'' };

function pessoas(){ return D.pessoas||[]; }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function passaFiltro(p){
  const f=S.f;
  if(f.unidade    && p.unidade   !==f.unidade) return false;
  if(f.supervisor && p.supervisor!==f.supervisor) return false;
  if(f.disciplina && p.disciplina!==f.disciplina) return false;
  if(f.obra       && p.obra      !==f.obra) return false;
  if(f.letra      && !(p.letra||'').split('/').map(s=>s.trim()).includes(f.letra)) return false;
  if(S.q){
    const q=norm(S.q);
    const alvo=norm([p.nome,p.obra,p.placa,p.equipamento,p.supervisor,p.disciplina,p.unidade].join(' '));
    if(!alvo.includes(q)) return false;
  }
  return true;
}

/* ═══════════════ Render: cabeçalho do dia ═══════════════ */
function renderTopo(){
  const d = S.data, hoje = d0(new Date());
  const ehHoje = difDias(d,hoje)===0;
  document.getElementById('dataSel').textContent =
    (ehHoje?'Hoje · ':'') + DIAS_LONG[d.getDay()];
  document.getElementById('dataSub').textContent =
    d.getDate()+' de '+['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][d.getMonth()]+' de '+d.getFullYear();
  document.querySelector('.btn-hoje').style.visibility = ehHoje ? 'hidden':'visible';

  const box = document.getElementById('letras'); box.innerHTML='';
  ['A','B','C','D'].forEach(L=>{
    const t = turnoLetra(L, d) || 'F';
    const rot = t==='T1'?'1º turno':t==='T2'?'2º turno':'Folga';
    const hr  = t==='T1'?'08:00–18:50':t==='T2'?'20:20–07:10':'';
    const sel = S.f.letra===L;
    box.insertAdjacentHTML('beforeend',
      `<button class="lt ${t} ${sel?'sel':''}" data-l="${L}" aria-pressed="${sel}"
         title="Filtrar a programação pela letra ${L}">
         <div class="n">${L}</div><div class="t">${rot}</div><div class="h">${hr}</div></button>`);
  });
  box.querySelectorAll('.lt').forEach(el=>el.onclick=()=>{
    const L = el.dataset.l;
    S.f.letra = (S.f.letra===L) ? '' : L;   // tocar de novo tira o filtro
    S.aba = 'dia';
    render();
  });
}

function renderRegua(){
  const box=document.getElementById('regua'); box.innerHTML='';
  const hoje=d0(new Date());
  for(let i=-DIAS_ANTES;i<=DIAS_DEPOIS;i++){
    const d=addDias(hoje,i);
    const sel = difDias(d,S.data)===0;
    let cells='';
    ['A','B','C','D'].forEach(L=>{
      const t=turnoLetra(L,d)||'F';
      cells+=`<div class="c ${t}">${t==='F'?'':L}</div>`;
    });
    box.insertAdjacentHTML('beforeend',
      `<button class="dia ${sel?'sel':''} ${i===0?'hoje-d':''}" data-i="${i}">
         <div class="ds">${DIAS_SEM[d.getDay()]}</div>
         <div class="dd">${String(d.getDate()).padStart(2,'0')}</div>
         <div class="ds" style="font-size:8px">${MESES[d.getMonth()]}</div>
         <div class="cells">${cells}</div>
       </button>`);
  }
  box.querySelectorAll('.dia').forEach(b=>b.onclick=()=>{
    S.data = addDias(hoje, +b.dataset.i); render();
  });
  const alvo = box.querySelector('.dia.sel');
  if(alvo) alvo.scrollIntoView({block:'nearest',inline:'center'});
}

/* ═══════════════ Abas e filtros ═══════════════ */
function renderAbas(){
  const n=document.getElementById('abas'); n.innerHTML='';
  ABAS.forEach(a=>{
    const b=document.createElement('button');
    b.textContent=a.r; b.className = S.aba===a.id?'on':'';
    b.onclick=()=>{S.aba=a.id; render();};
    n.appendChild(b);
  });
}
function opcoes(campo){
  const fora = OCULTA_FILTRO[campo]||[];
  const s=new Set();
  pessoas().forEach(p=>{ if(p[campo] && !fora.includes(p[campo])) s.add(p[campo]); });
  return [...s].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function renderFiltros(){
  const cx=document.getElementById('filtros');
  cx.style.display = (S.aba==='pessoa'||S.aba==='frota') ? 'none':'block';
  const box=document.getElementById('selects'); box.innerHTML='';
  const defs=[['unidade','Unidade'],['supervisor','Supervisor'],['disciplina','Disciplina'],
              ['obra','Obra'],['letra','Letra']];
  defs.forEach(([k,rot])=>{
    const sel=document.createElement('select');
    let opts = k==='letra' ? ['A','B','C','D'] : opcoes(k);
    sel.innerHTML = `<option value="">${rot}</option>` +
      opts.map(o=>`<option value="${o}" ${S.f[k]===o?'selected':''}>${o}</option>`).join('');
    if(S.f[k]) sel.classList.add('ativo');
    sel.onchange=()=>{ S.f[k]=sel.value; render(); };
    box.appendChild(sel);
  });
  if(Object.values(S.f).some(v=>v) || S.q){
    const b=document.createElement('button'); b.className='limpar'; b.textContent='Limpar';
    b.onclick=()=>{ S.f={unidade:'',supervisor:'',disciplina:'',letra:'',obra:''}; S.q='';
      document.getElementById('busca').value=''; render(); };
    box.appendChild(b);
  }
}

/* ═══════════════ Componentes ═══════════════ */
function veiculosDe(lista){
  const s=new Set();
  lista.forEach(p=>{
    if(p.papel==='Operador JCB'||p.papel==='Operador de plataforma') return;
    if(p.equipamento||p.placa) s.add((p.equipamento||'')+'|'+(p.placa||''));
  });
  return [...s].map(x=>x.split('|'));
}
function tagsObra(lista){
  let h='';
  const v=veiculosDe(lista);
  if(v.length<=1) v.forEach(([e,p])=>{
    if(e) h+=`<span class="tag">${e}</span>`;
    if(p) h+=`<span class="tag placa">${p}</span>`;
  });
  const jcb=new Set();
  lista.forEach(p=>{ if((p.papel==='Operador JCB'||p.papel==='Operador de plataforma') && p.equipamento) jcb.add(p.equipamento); });
  [...jcb].forEach(t=>h+=`<span class="tag jcb">${t}</span>`);
  return h;
}
function classeLetra(L){
  if(!L) return 'adm';
  if(L.includes('/')) return 'par';
  if(['A','B','C','D'].includes(L)) return L;
  return 'adm';
}
function badges(p, data, veicPessoal){
  let h='';
  if(veicPessoal && (p.equipamento||p.placa) && p.papel!=='Operador JCB' && p.papel!=='Operador de plataforma')
    h+=`<span class="tag placa" style="font-size:9.5px">${p.placa||p.equipamento}</span>`;
  if(p.papel==='Encarregado') h+='<span class="b enc">Encarregado</span>';
  if(p.papel==='Condutor')    h+='<span class="b vl">VL</span>';
  if(p.papel==='Operador JCB')h+=`<span class="b op">JCB ${p.equipamento||''}</span>`;
  if(p.papel==='Operador de plataforma') h+=`<span class="b op">Plataforma ${p.equipamento||''}</span>`;
  if(p.papel==='TST')         h+='<span class="b tst">TST</span>';
  if(p.otj)                   h+='<span class="b otj">On the job</span>';
  if(ausente(p))              h+=`<span class="b fer">${p.situacao}</span>`;
  if(data && !dentroJanela(p,data)){
    const i=pd(p.inicio), f=pd(p.fim);
    if(i && d0(data)<i)      h+=`<span class="b data">entra ${dstr(i).slice(0,5)}</span>`;
    else if(f && d0(data)>f) h+=`<span class="b data">até ${dstr(f).slice(0,5)}</span>`;
  }
  return h;
}
function linhaPessoa(p, data, mostrarLetra, veicPessoal){
  const fora = data && !vigente(p,data);
  const L = (p.letra||'').trim();
  const rot = L==='ADM'?'ADM': L==='SPOT'?'SPOT': L==='5x2/6x1'?'5x2':L;
  return `<li class="${fora?'fora':''}">
    ${mostrarLetra?`<span class="let ${classeLetra(L)}">${rot||'—'}</span>`:''}
    <span class="nome">${p.nome}${p.obs?`<small>${p.obs}</small>`:''}</span>
    <span class="badges">${badges(p,data,veicPessoal)}</span></li>`;
}
function cardObra(obra, lista, data, mostrarLetra){
  const veicPessoal = veiculosDe(lista).length>1;
  const ordem = {'Encarregado':0,'Condutor':1,'Operador JCB':2,'Operador de plataforma':3,'TST':4,'Colaborador':5};
  const L4 = {'A':0,'A/B':0.5,'B':1,'C':2,'C/D':2.5,'D':3,'ADM':8,'SPOT':8.5};
  lista = [...lista].sort((a,b)=>{
    const la=L4[a.letra]??9, lb=L4[b.letra]??9;
    if(la!==lb) return la-lb;
    return (ordem[a.papel]??9)-(ordem[b.papel]??9) || a.nome.localeCompare(b.nome,'pt-BR');
  });
  return `<div class="obra">
    <div class="obra-cab">
      <div class="nm">${obra}</div>
      <div class="tags">${tagsObra(lista)}</div>
    </div>
    <ul class="pes">${lista.map(p=>linhaPessoa(p,data,mostrarLetra,veicPessoal)).join('')}</ul>
  </div>`;
}
const ORD_DISC=['Liderança','Elétrica','Alta Tensão','Mecânica','Facilities','Segurança','Apoio'];
const ORD_UN=['AGA Cuiabá','AGA Lamego','AGA Queiroz','AGA CDS','Sede Cardozo'];
const ORD_UN_ADM=['AGA Lamego','AGA Cuiabá','AGA Queiroz','AGA CDS','Sede Cardozo'];
const ORD_OBRA=['Encarregado de Turno','Apoio Operacional','Automação','VL Logística',
 'Equipagem Elétrica BPF-PLANO','Equipagem Elétrica BPF-CRO','Manutenção Elétrica Planejada',
 'Projeto Flexibilidade','Ferramentaria',
 'Alta Tensão - Planta de Concreto','Alta Tensão - Obra Spot','Alta Tensão - Manutenções',
 'Equipagem Mecânica BPF-PLANO','Equipagem Mecânica BPF-CRO','Equipagem Mecânica Corretiva-01',
 'Equipagem Mecânica Corretiva-02','Manutenção Mecânica Planejada','Caldeiraria',
 'JCB MT - Projeto Flexibilidade','JCB MT - Obra de Infraestrutura','JCB MT - Paste Fill',
 'Manutenção Mecânica','Apoio Munck','Limpeza','Casa de Lanterna','Gestão TST Subsolo - Cuiabá'];
/* filtros não listam categorias internas de organização */
const OCULTA_FILTRO={supervisor:['Jeferson Gomes / Paulo Brito'],
                     disciplina:['Liderança','Apoio'],
                     obra:['Encarregado de Turno']};
function agrupar(lista, chave, ordUn){
  const m=new Map();
  lista.forEach(p=>{ const k=p[chave]; if(!m.has(k)) m.set(k,[]); m.get(k).push(p); });
  const ord = chave==='disciplina'?ORD_DISC : chave==='unidade'?(ordUn||ORD_UN) : null;
  const chaves=[...m.keys()].sort((a,b)=>{
    if(ord){ const ia=ord.indexOf(a), ib=ord.indexOf(b);
      if(ia!==ib) return (ia<0?99:ia)-(ib<0?99:ib); }
    return String(a).localeCompare(String(b),'pt-BR');
  });
  return new Map(chaves.map(k=>[k,m.get(k)]));
}
/* obras podem repetir de nome em disciplinas diferentes (ex.: Apoio Operacional) */
function agruparObras(lista){
  const m=new Map();
  lista.forEach(p=>{ const k=p.disciplina+' || '+p.obra; if(!m.has(k)) m.set(k,[]); m.get(k).push(p); });
  return [...m.entries()].map(([k,v])=>[k.split(' || ')[1],v])
    .sort((a,b)=>{
      const ia=ORD_OBRA.indexOf(a[0]), ib=ORD_OBRA.indexOf(b[0]);
      if(ia!==ib) return (ia<0?999:ia)-(ib<0?999:ib);
      return a[0].localeCompare(b[0],'pt-BR');
    });
}

/* ═══════════════ Aba: Do dia ═══════════════ */
function abaDia(){
  const data=S.data;
  const ativos = pessoas().filter(p=>passaFiltro(p) && vigente(p,data));
  const grupos = {T1:[],T2:[],ADM:[]};
  ativos.forEach(p=>{ const t=turnoPessoa(p,data); if(grupos[t]) grupos[t].push(p); });

  let h = `<div class="resumo">
    <div class="kpi t1"><div class="v">${grupos.T1.length}</div><div class="l">1º turno</div></div>
    <div class="kpi t2"><div class="v">${grupos.T2.length}</div><div class="l">2º turno</div></div>
    <div class="kpi adm"><div class="v">${grupos.ADM.length}</div><div class="l">Adm</div></div>
  </div>`;

  const secoes=[['T1','1º Turno'],['T2','2º Turno'],['ADM','Subsolo ADM e superfície']];
  let algum=false;
  secoes.forEach(([k,rot])=>{
    const lst=grupos[k]; if(!lst.length) return;
    algum=true;
    const hh = k==='ADM' ? '' : (k==='T1'?'08:00–18:50':'20:20–07:10');
    h += `<div class="bloco"><div class="faixa ${k}">
      <span class="p">${rot}</span><span class="hh">${hh}</span>
      <span class="cnt">${lst.length}</span></div>`;
    const porUnidade = agrupar(lst,'unidade', k==='ADM'?ORD_UN_ADM:null);
    [...porUnidade.entries()].forEach(([un,pl])=>{
      const porDisc = agrupar(pl,'disciplina');
      [...porDisc.entries()].forEach(([disc,pd_])=>{
        h += `<div class="sub">${disc}<span style="margin-left:auto;font-weight:600;color:var(--mut)">${un}</span></div>`;
        agruparObras(pd_).forEach(([obra,pp])=>{ h += cardObra(obra,pp,data,true); });
      });
    });
    h += `</div>`;
  });
  if(!algum){
    const L=S.f.letra;
    h += (L && turnoLetra(L,data)==='F')
      ? `<div class="vazio"><b>Letra ${L} de folga</b>Nenhum turno programado para a letra ${L} em ${dstr(data)}.</div>`
      : `<div class="vazio"><b>Ninguém programado</b>Nenhum colaborador atende aos filtros nesta data.</div>`;
  }
  return h;
}

/* ═══════════════ Aba: Equipes ═══════════════ */
function abaEquipes(){
  const lst = pessoas().filter(passaFiltro);
  if(!lst.length) return `<div class="vazio"><b>Sem resultados</b>Ajuste a busca ou os filtros.</div>`;
  let h='';
  const porUn = agrupar(lst,'unidade');
  [...porUn.entries()].forEach(([un,pu])=>{
    h += `<div class="bloco"><div class="bloco-tit"><span class="p">${un}</span>
      <span class="hh">${pu.length} ${pu.length===1?'posição':'posições'}</span></div>`;
    const porDisc = agrupar(pu,'disciplina');
    [...porDisc.entries()].forEach(([disc,pd_])=>{
      h += `<div class="sub">${disc}</div>`;
      agruparObras(pd_).forEach(([obra,pp])=>{ h += cardObra(obra,pp,S.data,true); });
    });
    h += `</div>`;
  });
  return h;
}

/* ═══════════════ Aba: Minha escala ═══════════════ */
function abaPessoa(){
  const nomes=[...new Set(pessoas().map(p=>p.nome))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const _fim=addDias(d0(new Date()),DIAS_DEPOIS);
  let h=`<div class="sub" style="margin-top:0">Minha escala<span style="margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0">${dstr(S.data).slice(0,5)} a ${dstr(_fim).slice(0,5)}</span></div>
    <div class="busca-pessoa">
      <input class="busca" id="bp" list="ln" placeholder="Digite seu nome…" value="${S.pessoa}" autocomplete="off">
      <datalist id="ln">${nomes.map(n=>`<option value="${n}">`).join('')}</datalist>`;
  if(!S.pessoa){
    const amostra = nomes.slice(0,6);
    h+=`<div class="sug">${amostra.map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`;
  }
  h+=`</div>`;

  if(S.pessoa){
    const regs = pessoas().filter(p=>norm(p.nome)===norm(S.pessoa))
      .sort((a,b)=>(pd(a.inicio)||new Date(1900,0,1))-(pd(b.inicio)||new Date(1900,0,1)));
    if(!regs.length){
      h+=`<div class="vazio" style="margin-top:12px"><b>Não encontrado</b>Confira a grafia do nome.</div>`;
    } else {
      regs.forEach((p,i)=>{
        h+=`<div class="pessoa-cab" style="margin-top:12px">
          <div class="n">${i===0?p.nome:p.obra}</div>
          <div class="i">${i===0?(p.obra?p.obra+'<br>':''):''}${p.unidade} · Letra <b>${p.letra||'—'}</b><br>Supervisor ${p.supervisor}
          ${ausente(p)?` · <b style="color:#FFD27A">${p.situacao}</b>`:''}</div></div>`;
        let linhas='', dias=0;
        const hoje=d0(new Date()), fimJanela=addDias(hoje,DIAS_DEPOIS);
        const nDias=Math.max(1, difDias(fimJanela,S.data)+1);
        for(let i=0;i<nDias;i++){
          const d=addDias(S.data,i);
          if(!dentroJanela(p,d)) continue;            // dia coberto por outra linha
          dias++;
          const t = ausente(p) ? 'SIT' : turnoPessoa(p,d);
          const rot = t==='SIT'?p.situacao: t==='T1'?'1º turno': t==='T2'?'2º turno': t==='ADM'?'Adm':'Folga';
          const cor = (t==='SIT'&&p.situacao!=='Folga')?'background:#FBEEE4;color:#8A4A16':
                      t==='T1'?'background:var(--t1-bg);color:var(--t1)':
                      t==='T2'?'background:var(--t2-bg);color:var(--t2)':
                      t==='ADM'?'background:#E4EEE9;color:var(--ok)':'background:var(--fg-bg);color:var(--fg)';
          linhas+=`<div class="l ${difDias(d,hoje)===0?'hj':''}">
            <span class="dt">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} <span>${DIAS_SEM[d.getDay()]}</span></span>
            <span class="st" style="${cor}">${rot}</span>
            <span class="hr">${(t==='T1'||t==='T2'||t==='ADM')?horario(p,t):''}</span></div>`;
        }
        h+= dias ? `<div class="prox">${linhas}</div>`
                 : `<div class="prox"><div class="l" style="color:var(--mut);font-size:13px">
                    Sem dias neste período${(()=>{const f=pd(p.fim),i2=pd(p.inicio);
                      if(f && f<S.data) return ` · encerrou em ${p.fim}`;
                      if(i2) return ` · começa em ${p.inicio}`; return '';})()}</div></div>`;
      });
    }
  }
  return h;
}

/* ═══════════════ Aba: Frota ═══════════════ */
function abaFrota(){
  const q=norm(S.q);
  const f=(D.frota||[]).filter(r=>!q||norm(r.join(' ')).includes(q));
  const grupos = new Map();
  f.forEach(r=>{ const k=r[2]||'Outros'; if(!grupos.has(k)) grupos.set(k,[]); grupos.get(k).push(r); });
  let h='';
  [...grupos.entries()].forEach(([tipo,rs])=>{
    h+=`<div class="sub">${tipo}</div><table class="frota">
      <tr><th>Equipe / vínculo</th><th>TAG</th><th>Placa</th></tr>`;
    rs.forEach(r=>{
      const sub=[r[0],r[5]].filter(x=>String(x||'').trim()).join(' · ');
      h+=`<tr><td>${r[1]}${sub?`<div style="font-size:11px;color:var(--mut)">${sub}</div>`:''}</td>
      <td class="mono" style="font-size:11.5px">${r[3]||'—'}</td>
      <td class="mono" style="font-size:11.5px">${r[4]||'—'}</td></tr>`;
    });
    h+=`</table>`;
  });
  return h || `<div class="vazio"><b>Sem resultados</b>Nenhum veículo encontrado.</div>`;
}

/* ═══════════════ Render principal ═══════════════ */
function render(){
  carregarRef(); carregarReg();
  renderTopo(); renderRegua(); renderAbas(); renderFiltros();
  const c=document.getElementById('conteudo');
  c.innerHTML = S.aba==='dia'?abaDia(): S.aba==='equipes'?abaEquipes():
                S.aba==='pessoa'?abaPessoa(): abaFrota();
  if(S.aba==='pessoa'){
    const bp=document.getElementById('bp');
    if(bp){
      bp.oninput=()=>{ const v=bp.value; clearTimeout(bp._t);
        bp._t=setTimeout(()=>{ S.pessoa=v; render(); const n=document.getElementById('bp'); if(n){n.focus();} },350); };
      bp.onchange=()=>{ S.pessoa=bp.value; render(); };
    }
    c.querySelectorAll('.sug button').forEach(b=>b.onclick=()=>{ S.pessoa=b.dataset.n; render(); });
  }

}
/* garante que o título caiba em uma linha, com ou sem a fonte da web */
function ajustaTopo(){
  const n=document.querySelector('nav.abas');
  if(n) document.documentElement.style.setProperty('--topo', n.offsetHeight+'px');
}
addEventListener('resize', ajustaTopo);
function ajustaTitulo(){
  const t=document.querySelector('header h1'); if(!t) return;
  t.style.fontSize='';
  let f=parseFloat(getComputedStyle(t).fontSize);
  const max=t.parentElement.clientWidth - 2*parseFloat(getComputedStyle(t.parentElement).paddingLeft);
  let g=0;
  while(t.scrollWidth>max+0.5 && f>14 && g++<40){ f-=0.5; t.style.fontSize=f+'px'; }
}
addEventListener('resize', ajustaTitulo);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(ajustaTitulo);
function irHoje(){ S.data=d0(new Date()); render(); }

document.getElementById('busca').addEventListener('input', e=>{
  clearTimeout(window._bt);
  window._bt=setTimeout(()=>{ S.q=e.target.value; render(); document.getElementById('busca').focus(); },320);
});

/* ═══════════════ Modo editora ═══════════════ */
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2600); }

if(new URLSearchParams(location.search).get('edit')!=='1'){
  document.getElementById('editor').classList.remove('on');
  document.body.style.paddingBottom='';
} else {
  document.getElementById('editor').classList.add('on');
  document.body.style.paddingBottom='72px';
  const FONTES=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
                'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
                'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  (function carrega(i){
    if(i>=FONTES.length){ toast('Não consegui carregar o leitor de planilhas. Verifique a internet.'); return; }
    const s=document.createElement('script');
    s.src=FONTES[i]; s.dataset.lazy='1';
    s.onerror=()=>carrega(i+1);
    document.head.appendChild(s);
  })(0);
}
document.getElementById('arq').addEventListener('change', ev=>{
  const f=ev.target.files[0]; if(!f) return;
  if(typeof XLSX==='undefined'){ toast('Aguarde um instante e tente de novo.'); return; }
  const fr=new FileReader();
  fr.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const cel=v=>{
        if(v instanceof Date) return String(v.getDate()).padStart(2,'0')+'/'+
          String(v.getMonth()+1).padStart(2,'0')+'/'+v.getFullYear();
        return v===null||v===undefined ? '' : String(v).trim();
      };
      const ler=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true}):null;
      const base=ler('Base');
      if(!base){ toast('A planilha precisa ter a aba "Base".'); return; }
      const cab=base[0].map(x=>String(x).trim());
      const ix=n=>cab.indexOf(n);
      const novas=[];
      for(let i=1;i<base.length;i++){
        const r=base[i]; if(!r || !cel(r[ix('Nome')])) continue;
        novas.push({
          unidade:cel(r[ix('Unidade')]), regime:cel(r[ix('Regime')]),
          supervisor:cel(r[ix('Supervisor')]), disciplina:cel(r[ix('Disciplina')]),
          obra:cel(r[ix('Obra')]), letra:cel(r[ix('Letra')]),
          nome:cel(r[ix('Nome')]), papel:cel(r[ix('Papel')])||'Colaborador',
          equipamento:cel(r[ix('Equipamento')]), placa:cel(r[ix('Placa')]),
          otj:cel(r[ix('On the Job')]), situacao:cel(r[ix('Situação')]),
          inicio:cel(r[ix('Início')]),
          fim:cel(r[ix('Fim')]), obs:cel(r[ix('Observação')])
        });
      }
      D.pessoas=novas;
      const fr_=ler('Frota'); if(fr_) D.frota=fr_.slice(1).filter(r=>r.some(c=>cel(c))).map(r=>r.map(cel));
      const es=ler('Escala');  if(es) D.escala=es.slice(1).filter(r=>cel(r[0])).map(r=>[cel(r[0]),cel(r[1])]);
      const rg=ler('Regimes'); if(rg) D.regimes=rg.slice(1).filter(r=>cel(r[0])).map(r=>r.map(cel));
      const cf=ler('Config');  if(cf) D.config=cf.slice(1).filter(r=>cel(r[0])).map(r=>[cel(r[0]),cel(r[1])]);
      D.meta={atualizado:dstr(new Date())};
      render();
      const padrao=/^\d{2}\/\d{2}\/\d{4}$/;
      const suspeitas=novas.filter(p=>(p.inicio&&!padrao.test(p.inicio))||(p.fim&&!padrao.test(p.fim)));
      toast(novas.length+' posições carregadas.' + (suspeitas.length
        ? ' Atenção: '+suspeitas.length+' com data fora do padrão dd/mm/aaaa ('+suspeitas[0].nome+'…).'
        : ' Agora baixe o painel atualizado.'));
    }catch(err){ toast('Não foi possível ler o arquivo: '+err.message); }
  };
  fr.readAsArrayBuffer(f);
});

function baixarHTML(){
  const doc=document.documentElement.cloneNode(true);
  doc.querySelector('#dados').textContent=JSON.stringify(D);
  doc.querySelectorAll('[data-render]').forEach(n=>n.innerHTML='');
  doc.querySelectorAll('script[data-lazy]').forEach(n=>n.remove());
  const ed=doc.querySelector('#editor');  if(ed) ed.className='editor';   // tira a barra preta
  const bd=doc.querySelector('body');     if(bd) bd.removeAttribute('style');
  const ar=doc.querySelector('#arq');     if(ar) ar.removeAttribute('value');
  const ts=doc.querySelector('#toast');   if(ts){ ts.className='toast'; ts.textContent=''; }
  const blob=new Blob(['<!DOCTYPE html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='programacao.html'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Arquivo gerado. Publique no GitHub substituindo o anterior.');
}

render();
ajustaTopo();
ajustaTitulo();
setTimeout(ajustaTitulo,300);
</script>
